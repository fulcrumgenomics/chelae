name: Check

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

# Each job runs one of the `ci-*` cargo aliases from .cargo/config.toml, the same
# ones `bash ci/check.sh` runs locally.
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, 2026-03-27
        with:
          toolchain: "1.95"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo ci-test
        run: cargo ci-test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, 2026-03-27
        with:
          toolchain: "1.95"
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo ci-lint
        run: cargo ci-lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, 2026-03-27
        with:
          toolchain: "1.95"
          components: rustfmt

      - name: cargo ci-fmt
        run: cargo ci-fmt
