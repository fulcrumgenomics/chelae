# Inventory of tools the pipeline knows about. Every tool the pipeline can
# run must have an entry here. Fields:
#   display_name  — pretty label for plots/tables
#   version       — informational; what we pin in pixi.toml
#   version_cmd   — shell command run once at aggregation time to capture
#                   the actual binary's version string
#   pixi_env      — (optional) which pixi environment to run this tool from.
#                   Unset = default env.
#   render_dir    — (optional) subdirectory under tools/ that holds the
#                   render.py. Defaults to the tool name; lets us reuse one
#                   render script across multiple version pins.
#   source        — informational tag ("bioconda-latest" / "workspace")
#                   recorded in bench.tsv for provenance.

chelae:
  display_name: chelae
  version_cmd: "chelae --version"
  source: workspace

fastp:
  display_name: fastp
  version: "1.3.7"
  version_cmd: "fastp --version 2>&1"
  source: bioconda-latest

cutadapt:
  display_name: cutadapt
  version: "5.2"
  version_cmd: "cutadapt --version"
  source: bioconda-latest

# Trim Galore 2.x (Rust rewrite, "Oxidized Edition"). Runs from its own pixi
# env; see pixi.toml.
trim-galore-rs:
  display_name: "TrimGalore 2.x (Rust)"
  version: "2.3.0"
  version_cmd: "trim_galore --version | head -n 5"
  pixi_env: trim-galore-rs
  source: bioconda-latest

trimmomatic:
  display_name: Trimmomatic
  version: "0.41"
  version_cmd: "trimmomatic -version 2>&1"
  source: bioconda-latest

bbduk:
  display_name: BBDuk
  version: "40.02"
  # bbduk.sh emits the JVM command to stderr and the actual version on a later
  # line; grep for the version marker to get just that one piece.
  version_cmd: "bbduk.sh --version 2>&1 | grep -iE '^(BB|version)' | head -1"
  source: bioconda-latest

adapterremoval:
  display_name: AdapterRemoval
  version: "3.0.2"
  version_cmd: "adapterremoval3 --version 2>&1"
  source: bioconda-latest

# atria: not in bioconda as of 2026-04. Only prebuilt is linux-ubuntu22 x86_64
# from GitHub releases (v4.1.4, May 2025). No macOS, no aarch64 prebuilt.
# To include, install manually (julia build or unpack the ubuntu tarball on
# an x86_64 Linux host) and add `atria:` back in.
