# Tier 2: runtime.
#
# The tools that are competitive on tier 1's paired-end runs, on two
# paired-end datasets deep enough (~50M pairs each) that even the fastest
# tool runs for about a minute. `wgs` trim config only, three replicates;
# the runtime tables report the median.
#
# Intended host: an 8-core instance, as for accuracy.config.yaml.

samples_tsv: config/performance.samples.tsv

# Reference FASTA for holodeck; see accuracy.config.yaml. Override with
# --config reference=URL_or_path.
reference: /Users/tfenne/work/refseq/GRCh38_full_analysis_set_plus_decoy_hla/GRCh38_full_analysis_set_plus_decoy_hla.fa

# Binaries the pipeline shells out to.
#
# `chelae_bin` is built from this workspace by `install.sh` — on x86_64
# that's the cargo-multivers launcher in `target/dist/`, on aarch64 it's
# `target/dist/chelae`. Leave as a relative path (resolved from the
# benchmark-pipeline directory) or override with an absolute path.
#
# `holodeck_bin` is `cargo install`-ed by install.sh into the pipeline's
# isolated cargo root. Pinning a path (rather than relying on PATH) means
# the value works whether you launch via run.sh or invoke snakemake
# directly inside `pixi run`.
chelae_bin: ../target/dist/chelae
holodeck_bin: .rust/cargo/bin/holodeck

# Output gzip compression level for every tool that exposes one (all but
# trimmomatic, which uses its built-in default). Level 1 is chelae's and
# trim-galore-rs's default, and it keeps compression from dominating the
# timings.
compression_level: 1

# RAM-backed directory (e.g. a tmpfs) for staged inputs and trimmed outputs,
# so timed runs never touch the disk; empty = read and write under results/.
# Host-specific, so set it on the command line:
#   ./run.sh <config> -- --config scratch_dir=/mnt/ram
scratch_dir: ""

# See accuracy.config.yaml. The slowest tool here takes a few minutes per run.
trim_timeout_minutes: 30

thread_counts: [8]

replicates: 3

warmup_cache: true

# cycles / instructions / IPC alongside wall time.
perf_stat: true

trim_configs:
  - wgs

tools:
  - chelae
  - fastp
  - cutadapt
  - trim-galore-rs
