[workspace]
name = "chelae-bench"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
description = "Benchmarking pipeline for chelae vs other FASTQ trimmers"

[dependencies]
python = ">=3.11"
snakemake-minimal = ">=8.0"
pyyaml = ">=6"
pandas = ">=2.0"
# GNU time for wall/user/sys/rss measurement. conda-forge's `time` package
# provides /usr/bin/time (as `time` in the env) on both Linux and macOS.
time = "*"
# Needed to faidx a URL-fetched reference when the remote doesn't provide
# a .fai sidecar. Also generally handy.
samtools = "*"
curl = "*"

# Note: holodeck is NOT a pixi dependency. install.sh runs
# `cargo install --root .rust/cargo --version 0.2.1 holodeck` so we get a
# specific version on every platform without relying on bioconda. The
# bioconda 0.2.0 build is missing linux-64 (CI upload glitch on
# bioconda-recipes #64734), and 0.2.1 carries a fix that prevents reads
# with non-ACGTN bases — which several trimmers reject — so we want it
# regardless. Once 0.2.1 lands on bioconda for all four platforms we can
# revisit moving it back here.

# Trimmer versions are the latest on bioconda as of September 2026.
[feature.trimmers.dependencies]
fastp = "1.3.7.*"
cutadapt = "5.2.*"
trimmomatic = "0.41.*"
bbmap = "40.02.*"
adapterremoval = "3.0.2.*"

# R + plotting. Heavy install; keep in a separate feature so CI can skip it.
[feature.plotting.dependencies]
r-base = ">=4.3"
r-tidyverse = "*"
r-optparse = "*"
r-scales = "*"

# Trim Galore 2.x (Oxidized Edition), the Rust rewrite of trim_galore. Own
# environment because bioconda has no osx-64 build of 2.x, so the feature is
# scoped to the platforms that do.
[feature.trim-galore-rs]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.trim-galore-rs.dependencies]
trim-galore = "2.3.0.*"

[environments]
default        = { features = ["trimmers", "plotting"], solve-group = "main" }
run            = { features = ["trimmers"],              solve-group = "main" }
plot           = { features = ["plotting"],              solve-group = "main" }
trim-galore-rs = { features = ["trim-galore-rs"], no-default-feature = true, solve-group = "trim-galore-rs-solve" }
